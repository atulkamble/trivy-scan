trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  imageRepository: "my-docker-image"
  dockerRegistryServiceConnection: "acr"
  tag: "$(Build.BuildId)"

stages:
  - stage: BuildAndScan
    displayName: "Docker Build and Trivy Scan"

    jobs:
      - job: BuildScan
        displayName: "Build and Scan Job"

        steps:
          # 1. Build and Push Docker Image
          - task: Docker@2
            displayName: "Build and Push Docker Image"
            inputs:
              containerRegistry: "$(dockerRegistryServiceConnection)"
              repository: "$(imageRepository)"
              command: "buildAndPush"
              Dockerfile: "**/Dockerfile"
              tags: |
                $(tag)

          # 2. Install Trivy
          - task: Bash@3
            displayName: "Install Trivy"
            inputs:
              targetType: "inline"
              script: |
                sudo apt-get update
                sudo apt-get install -y wget gnupg

                wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

                echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
                | sudo tee /etc/apt/sources.list.d/trivy.list

                sudo apt-get update
                sudo apt-get install -y trivy

                trivy --version

          # 3. Scan Docker Image
          - task: Bash@3
            displayName: "Trivy Scan"
            inputs:
              targetType: "inline"
              script: |
                echo "Running Trivy Security Scan..."

                trivy image \
                  --severity HIGH,CRITICAL \
                  --format json \
                  --output trivy-report.json \
                  my-docker-image:$(Build.BuildId)

          # 4. Read Report
          - task: Bash@3
            displayName: "Read Trivy Report"
            inputs:
              targetType: "inline"
              script: |
                echo "================================="
                echo "       TRIVY SCAN REPORT"
                echo "================================="

                cat trivy-report.json
